<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wishlist kx.exe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="desktop">

        <button class="sound-button" id="soundButton" aria-label="Musique">
            ♪
        </button>

        <button class="folder" id="folder">
            <div class="folder-icon">
                <div class="folder-tab"></div>
                <div class="folder-body"></div>
            </div>

            <span>wishlist kx.exe</span>
        </button>

    </main>


    <!-- Lecteur -->

    <section class="player" id="player">

        <video id="video" src="wishlist-kx.mp4" playsinline></video>

        <button class="close-button" id="closeButton">×</button>


        <!-- Contrôles -->

        <div class="controls" id="controls">

            <div class="progress-container">
                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                >
            </div>

            <div class="controls-bottom">

                <div class="left-controls">

                    <button id="backward" title="Reculer 5 secondes">
                        ↶
                    </button>

                    <button id="playPause" title="Lecture / Pause">
                        ▶
                    </button>

                    <button id="forward" title="Avancer 5 secondes">
                        ↷
                    </button>

                    <span class="time" id="time">
                        0:00 / 0:00
                    </span>

                </div>

                <button id="fullscreen" title="Plein écran">
                    ⛶
                </button>

            </div>

        </div>

    </section>


    <audio id="music" src="musique.mp3" loop></audio>

    <script src="script.js"></script>

</body>
</html>
