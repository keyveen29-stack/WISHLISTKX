<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wishlist kx.exe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="desktop">

        <button class="sound-button" id="soundButton" aria-label="Activer ou couper la musique">
            ♪
        </button>

        <button class="folder" id="folder">
            <div class="folder-icon">
                <div class="folder-tab"></div>
                <div class="folder-body"></div>
            </div>

            <span>wishlist kx.exe</span>
        </button>

    </main>

    <section class="player" id="player">
        <video id="video" src="wishlist-kx.mp4" playsinline></video>

        <button class="close-button" id="closeButton">
            ×
        </button>
    </section>

    <audio id="music" src="musique.mp3" loop></audio>

    <script src="script.js"></script>
</body>
</html>
